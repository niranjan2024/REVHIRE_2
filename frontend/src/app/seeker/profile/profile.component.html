<section class="card">
  <h2>Complete Profile</h2>

  <div class="profile-header">
    <div class="avatar-wrap">
      <img *ngIf="profileImageDataUrl; else defaultAvatar" [src]="profileImageDataUrl" alt="Profile image" class="avatar" />
      <ng-template #defaultAvatar>
        <div class="avatar avatar-fallback">U</div>
      </ng-template>
    </div>
    <label class="upload-label">
      Profile Image
      <input type="file" accept="image/*" (change)="uploadProfileImage($event)" />
    </label>
  </div>

  <form [formGroup]="form" (ngSubmit)="save()" class="form">
    <label>Username <input formControlName="username" readonly /></label>
    <label>Full Name <input formControlName="name" /></label>
    <label>Email <input formControlName="email" /></label>
    <label>Mobile Number <input formControlName="phone" /></label>
    <label>Location <input formControlName="location" /></label>
    <label>Skills (comma separated) <input formControlName="skills" /></label>
    <label>Education (comma separated) <input formControlName="education" /></label>
    <label>Experience (comma separated) <input formControlName="experience" /></label>
    <label>Certifications (comma separated) <input formControlName="certifications" /></label>
    <button type="submit">Save Profile</button>
  </form>
  <p class="message" *ngIf="message">{{ message }}</p>
</section>
