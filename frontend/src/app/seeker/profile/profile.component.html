<section class="card">
  <h2>Profile</h2>
  <form [formGroup]="form" (ngSubmit)="save()" class="form">
    <label>Name <input formControlName="name" /></label>
    <label>Phone <input formControlName="phone" /></label>
    <label>Location <input formControlName="location" /></label>
    <label>Current Employment Status <input formControlName="currentEmploymentStatus" /></label>
    <label>Skills (comma separated) <input formControlName="skills" /></label>
    <label>Education (comma separated) <input formControlName="education" /></label>
    <label>Experience (comma separated) <input formControlName="experience" /></label>
    <label>Certifications (comma separated) <input formControlName="certifications" /></label>
    <button type="submit">Save Profile</button>
  </form>
  <p class="message" *ngIf="message">{{ message }}</p>
</section>
