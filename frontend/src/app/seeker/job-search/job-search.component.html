<section>
  <div class="welcome-card">
    <p class="welcome-tag">Job Seeker Dashboard</p>
    <h2>Welcome, {{ seekerName }}</h2>
    <p class="welcome-subtitle">Find jobs that match your profile and apply in one click.</p>
  </div>

  <h2>Search Jobs</h2>
  <form [formGroup]="filtersForm" (ngSubmit)="search()" class="filters">
    <input formControlName="role" placeholder="Job role" />
    <input formControlName="location" placeholder="Location" />
    <input formControlName="experienceYears" type="number" placeholder="Max experience years" />
    <input formControlName="companyName" placeholder="Company" />
    <input formControlName="minSalary" type="number" placeholder="Min salary" />
    <input formControlName="maxSalary" type="number" placeholder="Max salary" />
    <select formControlName="jobType">
      <option value="">Any job type</option>
      <option value="full-time">Full-time</option>
      <option value="part-time">Part-time</option>
      <option value="contract">Contract</option>
      <option value="internship">Internship</option>
      <option value="remote">Remote</option>
    </select>
    <button type="submit">Search</button>
  </form>

  <p *ngIf="message" class="message">{{ message }}</p>

  <div class="list">
    <app-job-card
      *ngFor="let job of jobs"
      [job]="job"
      [isFavorite]="isFavorite(job.id)"
      (apply)="apply($event)"
      (favorite)="toggleFavorite($event)"></app-job-card>
  </div>
</section>
