<header class="navbar" [class.home-navbar]="isHomeRoute && !authService.isLoggedIn()">
  <nav>
    <a *ngIf="!authService.isLoggedIn()" routerLink="/" routerLinkActive="active">RevHire</a>

    <ng-container *ngIf="authService.getRole() === 'seeker'">
      <a routerLink="/seeker/jobs" routerLinkActive="active">Jobs</a>
      <a routerLink="/seeker/applications" routerLinkActive="active">Applications</a>
      <a routerLink="/seeker/profile" routerLinkActive="active">Complete Profile</a>
      <a routerLink="/seeker/resume" routerLinkActive="active">Resume</a>
      <a routerLink="/seeker/favorites" routerLinkActive="active">Favorites</a>
    </ng-container>

    <ng-container *ngIf="authService.getRole() === 'employer'">
      <a routerLink="/employer/dashboard" routerLinkActive="active">Dashboard</a>
      <a routerLink="/employer/jobs" routerLinkActive="active">Postings</a>
      <a routerLink="/employer/applicants" routerLinkActive="active">Applicants</a>
    </ng-container>

    <a *ngIf="authService.isLoggedIn()" routerLink="/notifications" routerLinkActive="active">
      Notifications ({{ unreadCount }})
    </a>
  </nav>

  <div *ngIf="showAuthActions" class="auth">
    <a *ngIf="showGuestAuthLinks" routerLink="/login">Login</a>
    <a *ngIf="showGuestAuthLinks && !isForgotPasswordRoute" routerLink="/register">Register</a>
    <div *ngIf="authService.isLoggedIn()" class="profile-menu">
      <button type="button" class="avatar-btn" (click)="toggleProfileMenu()">
        <img
          *ngIf="authService.getCurrentUser()?.profileImageDataUrl; else avatarFallback"
          [src]="authService.getCurrentUser()?.profileImageDataUrl"
          alt="Profile"
          class="avatar-img"
        />
        <ng-template #avatarFallback>
          <span class="avatar-fallback">
            {{ authService.getCurrentUser()?.name?.charAt(0) || 'U' }}
          </span>
        </ng-template>
      </button>

      <div class="menu-box" *ngIf="profileMenuOpen">
        <button type="button" class="menu-item" (click)="openProfile()">Complete Profile</button>
        <button type="button" class="menu-item" (click)="openChangePassword()">Change Password</button>
        <button type="button" class="menu-item" (click)="logout()">Log Out</button>
      </div>
    </div>
  </div>
</header>
