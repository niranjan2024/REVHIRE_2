<article class="card" *ngIf="job">
  <h3>{{ job.title }} <small>({{ job.jobType }})</small></h3>
  <p><strong>{{ job.companyName }}</strong> | {{ job.location }}</p>
  <p>{{ job.description }}</p>
  <p>Experience: {{ job.experienceYears }} years | Salary: {{ job.salaryMin }} - {{ job.salaryMax }}</p>
  <p>Skills: {{ job.skills.join(', ') }}</p>
  <div class="actions">
    <button type="button" (click)="favorite.emit(job)">{{ isFavorite ? 'Unsave' : 'Save' }}</button>
    <button type="button" [disabled]="!canApply" (click)="apply.emit(job)">
      {{ canApply ? 'Apply' : 'Applied' }}
    </button>
  </div>
</article>
