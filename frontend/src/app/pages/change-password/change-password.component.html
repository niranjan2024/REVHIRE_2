<section class="card">
  <h2>Change Password</h2>

  <form [formGroup]="form" (ngSubmit)="submit()" class="form">
    <label>Old Password <input formControlName="oldPassword" type="password" /></label>
    <label>New Password <input formControlName="newPassword" type="password" /></label>
    <label>Confirm Password <input formControlName="confirmPassword" type="password" /></label>
    <button type="submit">Update Password</button>
  </form>

  <p class="success" *ngIf="message">{{ message }}</p>
  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
</section>
