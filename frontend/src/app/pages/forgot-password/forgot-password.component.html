<section class="card">
  <h2>Forgot Password</h2>

  <form [formGroup]="usernameForm" (ngSubmit)="fetchQuestion()" class="form">
    <label>Username <input formControlName="username" type="text" /></label>
    <button type="submit">Get Security Question</button>
  </form>

  <div *ngIf="question">
    <p><strong>Security Question:</strong> {{ question }}</p>
    <form [formGroup]="resetForm" (ngSubmit)="resetPassword()" class="form">
      <label>Answer <input formControlName="answer" type="text" /></label>
      <label>New Password <input formControlName="newPassword" type="password" /></label>
      <label>Confirm Password <input formControlName="confirmPassword" type="password" /></label>
      <button type="submit">Reset Password</button>
    </form>
  </div>

  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
  <p class="success" *ngIf="successMessage">{{ successMessage }}</p>
</section>
