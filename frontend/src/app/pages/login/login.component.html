<section class="login-shell">
  <div class="auth-card">
    <nav class="auth-tabs">
      <a routerLink="/login" class="active-tab">Login</a>
      <a routerLink="/register">Register</a>
    </nav>

    <h2>Welcome Back</h2>

    <form [formGroup]="form" (ngSubmit)="submit()" class="form">
      <label for="email">Email</label>
      <input id="email" formControlName="email" type="email" placeholder="Enter your email" />

      <label for="password">Password</label>
      <input id="password" formControlName="password" [type]="showPassword ? 'text' : 'password'" placeholder="Enter your password" />

      <label class="inline-check">
        <input type="checkbox" [checked]="showPassword" (change)="showPassword = !showPassword" />
        Show password
      </label>

      <button type="submit">Login</button>
      <a routerLink="/forgot-password" class="forgot-link">Forgot Password?</a>
      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
    </form>
  </div>
</section>
