<section>
  <div class="welcome-card">
    <p class="welcome-tag">Employer Dashboard</p>
    <h2>Welcome, {{ employerName }}</h2>
    <p class="welcome-subtitle">Track your postings and review candidate activity in one place.</p>
  </div>

  <h2>Employer Dashboard</h2>
  <div class="grid">
    <article class="metric"><h3>Total Jobs</h3><p>{{ totalJobs }}</p></article>
    <article class="metric"><h3>Active Jobs</h3><p>{{ activeJobs }}</p></article>
    <article class="metric"><h3>Total Applications</h3><p>{{ totalApplications }}</p></article>
    <article class="metric"><h3>Pending Reviews</h3><p>{{ pendingReviews }}</p></article>
  </div>
</section>
