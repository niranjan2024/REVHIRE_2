# ================= APPLICATION =================
spring.application.name=RevHire

# ================= SERVER =================
server.port=8080

# ================= DATASOURCE (MYSQL) =================
spring.datasource.url=jdbc:mysql://localhost:3306/revhire_db2
spring.datasource.username=root
spring.datasource.password=MySql@1608
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================= JPA / HIBERNATE =================
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ================= CONNECTION POOL (HIKARI) =================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=RevHireHikariCP

# ================= LOGGING =================
logging.level.root=INFO
logging.level.com.revhire=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.file.name=logs/revhire.log


# ================= LOG4J2 =================
logging.config=classpath:log4j2.xml

# ================= JSON =================
spring.jackson.serialization.indent-output=true

# ================= VALIDATION =================
spring.web.resources.add-mappings=false
